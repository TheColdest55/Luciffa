<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luciffa Arcade</title>
  <style>
    :root {
      --bg: #0b1020;
      --surface: rgba(22, 29, 55, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f5f7ff;
      --muted: #a9b2d3;
      --purple: #9b8cff;
      --blue: #65d8ff;
      --yellow: #ffd36b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, #272260 0, transparent 28rem),
        radial-gradient(circle at 90% 25%, #123c63 0, transparent 26rem),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .logo span {
      color: var(--purple);
    }

    nav {
      display: flex;
      gap: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    nav a:hover {
      color: var(--text);
    }

    .hero {
      padding: 72px 0 56px;
      max-width: 760px;
    }

    .eyebrow {
      color: var(--yellow);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 15px 0 18px;
      font-size: clamp(45px, 8vw, 86px);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .hero p {
      max-width: 570px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin: 30px 0 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -0.04em;
    }

    .section-title span {
      color: var(--muted);
      font-size: 14px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding-bottom: 80px;
    }

    .game-card {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-card.active:hover {
      transform: translateY(-6px);
      border-color: var(--purple);
    }

    .game-number {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .game-card h3 {
      margin: 42px 0 8px;
      font-size: 29px;
      letter-spacing: -0.04em;
    }

    .game-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .play {
      margin-top: 22px;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
    }

    .coming {
      opacity: 0.62;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 22px 0 34px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      header {
        padding: 20px 0;
      }

      nav {
        gap: 14px;
      }

      .hero {
        padding: 54px 0 38px;
      }

      .games {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="logo" href="/">luciffa<span>.</span></a>
      <nav>
        <a href="#games">游戏大厅</a>
        <a href="#about">关于本站</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">Luciffa Arcade</div>
        <h1>玩点有意思的。</h1>
        <p>
          一个为轻松思考、短暂放松和一点点挑战而做的小游戏角落。
          从数独开始，慢慢加入更多好玩的作品。
        </p>
      </section>

      <section id="games">
        <div class="section-title">
          <h2>游戏大厅</h2>
          <span>持续更新中</span>
        </div>

        <div class="games">
          <a class="game-card active" href="sudoku.html">
            <div>
              <div class="game-number">01 · LOGIC</div>
              <h3>数独</h3>
              <p>填满九宫格，让每一行、每一列和每个小宫都恰好包含 1 到 9。</p>
            </div>
            <div class="play">开始游戏 →</div>
          </a>

          <div class="game-card coming">
            <div>
              <div class="game-number">02 · MEMORY</div>
              <h3>记忆方格</h3>
              <p>观察短暂亮起的方格，用记忆复现它们的顺序。</p>
            </div>
            <div class="play">即将推出</div>
          </div>

          <div class="game-card coming">
            <div>
              <div class="game-number">03 · NUMBERS</div>
              <h3>数字冲刺</h3>
              <p>在有限时间内完成一组快速、有趣的数字挑战。</p>
            </div>
            <div class="play">即将推出</div>
          </div>
        </div>
      </section>
    </main>

    <footer id="about">
      © 2026 Luciffa Arcade · Made for play.
    </footer>
  </div>
</body>
</html>
